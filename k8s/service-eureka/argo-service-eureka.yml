apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-eureka
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: 'https://github.com/Sabrynette/BACKEND-FINAL.git'
    targetRevision: master
    path: k8s/service-eureka
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: cd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

