apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-image
spec:
  params:
    - name: contextDir
      type: string
    - name: image
      type: string
  workspaces:
    - name: shared
  steps:
    - name: build
      image: gcr.io/kaniko-project/executor:latest
      env:
        - name: HOME
          value: /tekton/home
        - name: DOCKER_CONFIG
          value: /tekton/home/.docker
      args:
        - --dockerfile=/workspace/shared/$(params.contextDir)/Dockerfile
        - --context=/workspace/shared/$(params.contextDir)
        - --destination=$(params.image)
        - --skip-tls-verify
        - --skip-tls-verify-pull

